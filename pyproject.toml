[build-system]
# 3.12 is the first flit_core that understands the PEP 639 license expression
# and `license-files` declared below; older backends reject them.
requires = ["flit_core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "vappman"
# `vappman/__init__.py:__version__` is the single source of truth.  Flit reads
# it at build time, so `bless` can rewrite a throwaway X.Y.Z.99.N in a copy
# without touching the tree.
dynamic = ["version"]
description = "A visual wrapper for appman"
authors = [
    { name = "Joe Defen", email = "joedef@google.com" }
]
readme = "README.md"
# SPDX expression (PEP 639) rather than the deprecated table form: this is what
# puts `License-Expression: MIT` in the core metadata, which is also why the
# legacy `License :: ...` classifier below must not come back.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["app", "installer", "manager", "appimages"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'console-window == 2.1.3',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/vappman"
"Bug Tracker" = "https://github.com/joedefen/vappman/issues"

[project.scripts]
vappman = "vappman.main:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# The release gate (`./bless`) runs ruff, compileall and pytest with coverage,
# then builds, inspects, `twine check`s and smoke-installs the artifacts.  Those
# tools must live in the interpreter that runs bless, and twine/packaging must
# be new enough to validate Metadata 2.5 from flit_core 3.12.
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=7",
    "packaging>=26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["vappman"]

[tool.coverage.report]
# Set just below the measured number when the shared gate was adopted.  Raise
# it as the suite grows; never lower it to make a commit pass.
fail_under = 35

[tool.bless]
# The default is the pair, written out here so the branch model is visible
# where the rest of this project's identity lives.  `publish` aligns `dev`
# with `main` before tagging, and pushes both.
branches = ["main", "dev"]

[tool.ruff]
# Keep the lint gate identical on every machine: no global/user config can
# change which rules the gate enforces.  The selection below is deliberately
# the conservative, version-stable core; a stricter ratchet can be adopted
# later without changing bless.
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]